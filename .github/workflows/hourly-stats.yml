name: Hourly Stats CI

on:
  repository_dispatch:
    types: [hourly_stats]
  workflow_dispatch:
  schedule:
    # Fallback; the uptime scheduler dispatches this every 15 minutes.
    - cron: "17 * * * *"

concurrency:
  group: lynkbyte-hourly-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Update hourly response stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Compute and commit hourly averages
        run: |
          set -euo pipefail
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            node scripts/hourly-stats.js
            if git diff --quiet -- data/hourly.json; then
              echo "No hourly stats change"
              exit 0
            fi
            git add data/hourly.json
            git commit -m ":bar_chart: Update hourly response stats [skip ci]"
            if git push; then
              echo "Pushed hourly stats"
              exit 0
            fi
            echo "Push rejected; retrying from latest master"
          done
          echo "::error::Could not push hourly stats after 3 attempts"
          exit 1
