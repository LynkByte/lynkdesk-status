name: Versions CI

on:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [versions]
  workflow_dispatch:

concurrency:
  group: lynkbyte-versions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Update service versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      # LynkByte/lynkdesk-web is private. Add an APP_REPO_TOKEN secret with
      # read access to it (or grant the existing GH_PAT access) to enable the
      # automatic update. Without it, versions.json is left unchanged.
      - name: Read the latest app release
        id: release
        env:
          GH_TOKEN: ${{ secrets.APP_REPO_TOKEN || secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if ! payload=$(gh api repos/LynkByte/lynkdesk-web/releases/latest --jq '{version:.tag_name,published_at:.published_at}' 2>/tmp/gh.err); then
            echo "::warning::Could not read LynkByte/lynkdesk-web releases. Add APP_REPO_TOKEN with read access to the private app repository, or grant GH_PAT access. $(cat /tmp/gh.err)"
            payload=""
          fi
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Write versions.json
        env:
          PAYLOAD: ${{ steps.release.outputs.payload }}
        run: |
          set -euo pipefail
          if [ -z "$PAYLOAD" ]; then
            echo "No release payload; leaving data/versions.json unchanged."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const release = JSON.parse(process.env.PAYLOAD);
            if (!release.version) throw new Error("release has no version");
            const data = {
              "web-app": { version: release.version, published_at: release.published_at || null },
              "api": { version: release.version, published_at: release.published_at || null },
              "corporate-website": { version: null },
              "database-and-cache": { version: null }
            };
            fs.writeFileSync("data/versions.json", JSON.stringify(data, null, 2) + "\n");
          '

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/versions.json; then
            echo "No version change"
            exit 0
          fi
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git add data/versions.json
          git commit -m ":arrow_up: Update service versions [skip ci]"
          git push
